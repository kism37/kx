name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js (for AST worker)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Install AST worker
        run: |
          cd ast_worker
          npm install --silent

      - name: Run detector fixtures
        run: node ast_worker/test_detectors.js

      - name: Run e2e test
        run: python test_e2e_integration.py

      - name: Smoke-test CLI
        run: python kx.py --help
